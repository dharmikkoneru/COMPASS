# COMPASS — Minikube demo manifests (single file: Deployment + Service).
#
#   minikube start
#   eval $(minikube docker-env)      # build inside the cluster
#   docker build -t compass-web:local .
#   kubectl apply -f k8s/compass.yaml
#   minikube service compass-web     # opens the app
#
# Fill in your real Supabase coordinates at the two marked lines, or
# pipe them in:  envsubst < k8s/compass.yaml | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: compass-web
  labels:
    app: compass-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compass-web
  template:
    metadata:
      labels:
        app: compass-web
    spec:
      containers:
        - name: web
          image: compass-web:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: compass-web
spec:
  type: ClusterIP
  selector:
    app: compass-web
  ports:
    - port: 80
      targetPort: 80
