# COMPASS — CI. Typecheck, lint, unit tests on every push and PR.
# Runs before any deploy: Netlify (once git-connected) deploys only
# after this workflow passes on the branch.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test
