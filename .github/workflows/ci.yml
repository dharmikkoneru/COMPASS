# COMPASS — CI. Typecheck, lint and test both halves of the project.
#
# Runs before any deploy: Vercel, Netlify and Render each deploy only after
# this workflow passes on the branch.
#
#   verify — the React app (tsc, oxlint, vitest)
#   api    — the FastAPI AI service (ruff, pytest)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc -b --force

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        # The service lives in backend/; the repository root is the Vite app.
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        # No secrets are needed: the suite fakes PostgREST and Gemini, and
        # builds its own ES256 key pair to exercise token verification.
        run: pytest

      - name: Import smoke test
        run: python -c "from app.main import app; print(app.title, app.version)"
