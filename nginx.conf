# COMPASS — nginx SPA config: static assets + history-API fallback.
# deep links like /materials or /quiz/<id> must serve index.html.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Vite fingerprints assets; cache them hard.
  location /assets/ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # Everything that is not a real file falls through to the SPA.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
